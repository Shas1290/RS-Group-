server {
    listen 80;
    
    # Where your static files are stored in the container
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        # This fixes the 404 error!
        # It tells Nginx to try the exact URI, then the URI as a directory, 
        # and if neither exists, fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets like JS, CSS, and images
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
